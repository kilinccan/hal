name: Günün ayeti

on:
  schedule:
    - cron: "5 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: gunluk
  cancel-in-progress: false

jobs:
  yenile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Üret, commit et, IndexNow'a bildir
        run: |
          set -e
          python _arac/gunluk.py
          git add gunun-ayeti feed.xml sitemap-gunluk.xml
          if git diff --cached --quiet; then
            echo "Değişiklik yok"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: günün ayeti"
          git push
          KEY=$(ls *.txt | grep -E '^[0-9a-f]{32}\.txt$' | head -n1 | sed 's/\.txt$//')
          test -n "$KEY"
          curl -fsS -X POST https://api.indexnow.org/indexnow \
            -H 'Content-Type: application/json; charset=utf-8' \
            -d "{\"host\":\"kilinccan.github.io\",\"key\":\"$KEY\",\"keyLocation\":\"https://kilinccan.github.io/hal/$KEY.txt\",\"urlList\":[\"https://kilinccan.github.io/hal/gunun-ayeti/\",\"https://kilinccan.github.io/hal/feed.xml\"]}"
